name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Building on a hosted macOS runner is slow, so PRs that only touch docs, agent files, the license,
  # the brand assets or the e2e fixture scripts skip the Rust job. ci-ok passes when it's skipped.
  # Nothing the build reads lives in brand/ yet. Once the app icon there feeds the build, narrow
  # brand/* so changes to it run the Rust job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the Rust job runs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A separate assignment, so a failing diff fails the step instead of skipping Rust.
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          rust=false
          while IFS= read -r file; do
            case "$file" in
              '' | docs/* | *.md | .claude/* | .agents/* | LICENSE | brand/* | script/e2e/*) ;;
              *)
                echo "$file changed, so the Rust job runs."
                rust=true
                break
                ;;
            esac
          done <<< "$files"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  commitlint:
    name: commitlint
    # Dependabot commit bodies exceed commitlint's line-length limits. Its PR title, which becomes
    # the squash commit, is still checked by pr-title.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: node pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  symlinks:
    name: symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the agent symlinks
        run: script/check-symlinks.sh

  # Fails while a line still uses the project's first name outside the names the rename keeps, such
  # as one from a branch merged without script/rename-to-lo.sh. Goes when that script does.
  rename:
    name: rename
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that only the kept names use the first name
        run: script/rename-to-lo.sh --check

  # The e2e fixture scripts skip the Rust job, so this is their only check. ubuntu-latest ships
  # shellcheck.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the e2e fixture scripts
        run: shellcheck --version && shellcheck script/e2e/*.sh

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Pinned, so a new macOS or Xcode arrives in a PR of its own.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # Every run builds from a fresh checkout, so incremental state and debug info would only cost
      # time and disk, and make the cache bigger.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "0"
    steps:
      # Also checks out Zed (third_party/zed), one commit deep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # cmake, pinned in mise.toml, builds wasmtime for Zed's tree-sitter.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: cmake

      # With no arguments, rustup installs the toolchain and components in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install && rustc --version && cmake --version

      # Caches registry and git crates. It drops Zed's crates, because they sit inside the
      # repository, so those build on every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Not --all, which also formats path dependencies: Zed's crates.
      - name: Format
        run: cargo fmt --check

      # xtask (crates/xtask) is its own workspace, so the steps for Lo's workspace skip it.
      - name: Check xtask
        run: |
          cargo fmt --check --manifest-path crates/xtask/Cargo.toml
          cargo clippy --locked --manifest-path crates/xtask/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/xtask/Cargo.toml

      # --locked everywhere. sync-zed prunes against Cargo.lock, which the clippy and test steps
      # check is committed up to date.
      - name: Check the Cargo settings copied from Zed
        run: cargo --locked xtask sync-zed --check

      # Fails when the set of Zed crates linked into Lo changes; see script/zed-crates.txt.
      - name: Check the Zed crates compiled in
        run: script/check-zed-crates.sh

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Disk use
        if: always()
        run: df -h . && du -sh target ~/.cargo/registry ~/.cargo/git 2>/dev/null || true

  # The one required check besides pr-title, so adding jobs never changes the ruleset. Skipped jobs
  # pass.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, commitlint, symlinks, rename, shellcheck, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          exit 1
