# Its own workspace, so `cargo xtask` builds without resolving rozed's, which needs Zed's checkout
# and the Cargo settings xtask copies from it.
[workspace]

[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.86"
toml_edit = "0.23.7"

[dev-dependencies]
tempfile = "3.20.0"
