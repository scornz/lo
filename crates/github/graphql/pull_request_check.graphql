# The cheap poll: enough to tell whether a pull request changed, for 1 point. A PR's updatedAt
# doesn't move when it joins a stack, but its timeline's does, so this asks for both.
query PullRequestCheck($owner: String!, $name: String!, $number: Int!) {
  rateLimit {
    cost
    limit
    remaining
    used
    resetAt
  }
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      updatedAt
      state
      isDraft
      baseRefName
      baseRefOid
      headRefOid
      timelineItems {
        updatedAt
        totalCount
      }
      commits {
        totalCount
      }
      reviews {
        totalCount
      }
      reviewThreads {
        totalCount
      }
      comments {
        totalCount
      }
      changedFiles
    }
  }
}
