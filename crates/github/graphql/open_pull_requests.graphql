# A repository's open pull requests, with what stack detection needs: branches, head commits and
# native stack membership. A page at a time, newest first: rozed reads at most 1,000, and when a
# repository has more, the oldest are the ones to leave out. Creation time doesn't change while
# paging, unlike the time of the last update.
query OpenPullRequests($owner: String!, $name: String!, $first: Int!, $after: String) {
  rateLimit {
    cost
    limit
    remaining
    used
    resetAt
  }
  repository(owner: $owner, name: $name) {
    pullRequests(
      states: [OPEN]
      orderBy: { field: CREATED_AT, direction: DESC }
      first: $first
      after: $after
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        number
        title
        isDraft
        updatedAt
        baseRefName
        baseRefOid
        headRefName
        headRefOid
        isCrossRepository
        headRepositoryOwner {
          __typename
          login
        }
        stackEntry {
          position
          stack {
            number
            size
            baseRefName
          }
        }
      }
    }
  }
}
