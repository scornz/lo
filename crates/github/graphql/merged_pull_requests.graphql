# The merged pull requests from one head branch, newest first: the layers below a stack's open ones
# whose branch an open pull request still targets, which finding stacks follows down to a trunk
# (`stacks::branches_to_look_up`).
query MergedPullRequests(
  $owner: String!
  $name: String!
  $headRefName: String!
  $first: Int!
) {
  rateLimit {
    cost
    limit
    remaining
    used
    resetAt
  }
  repository(owner: $owner, name: $name) {
    pullRequests(
      states: [MERGED]
      headRefName: $headRefName
      orderBy: { field: CREATED_AT, direction: DESC }
      first: $first
    ) {
      nodes {
        ...MergedPullRequestFields
      }
    }
  }
}

# What finding stacks reads of a merged pull request. `OpenPullRequests` reads the same.
fragment MergedPullRequestFields on PullRequest {
  number
  createdAt
  baseRefName
  baseRef {
    target {
      __typename
      oid
    }
  }
  headRefName
  headRefOid
  isCrossRepository
  commits(last: 20) {
    nodes {
      commit {
        oid
      }
    }
  }
  # Its head is in its base branch when it's this commit or one of its parents: after a merge
  # commit or a fast-forward, not a squash or a rebase.
  mergeCommit {
    oid
    parents(first: 2) {
      nodes {
        oid
      }
    }
  }
  stackEntry {
    position
    stack {
      number
    }
  }
}
